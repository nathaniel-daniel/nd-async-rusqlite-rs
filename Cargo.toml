[package]
name = "nd-async-rusqlite"
version = "0.1.0"
authors = [ "Nathaniel Daniel <nathaniel.daniel12@gmail.com>" ]
edition = "2024"
rust-version = "1.85"
description = "Utilities for accessing an Sqlite database via rusqlite in an async runtime."
readme = "README.md"
repository = "https://github.com/nathaniel-daniel/nd-async-rusqlite-rs"
license = "MIT OR Apache-2.0"
keywords = ["async", "rusqlite", "sql", "sqlite", "pool"]
categories = ["asynchronous", "database"]


[dependencies]
rusqlite = "0.40.2"
tokio = { version = "1.54.1", features = ["sync"] }

# wal-pool
crossbeam-channel = { version = "0.5.17", optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[features]
# Activate the rusqlite "array" feature
array = ["rusqlite/array"]

# Activate the rusqlite "backup" feature
backup = ["rusqlite/backup"]

# Activate the rusqlite "bundled" feature
bundled = ["rusqlite/bundled"]

# Activate the rusqlite "cache" feature
cache = ["rusqlite/cache"]

# Activate the rusqlite "fallible_uint" feature
fallible_uint = ["rusqlite/fallible_uint"]

# Activate the rusqlite "functions" feature
functions = ["rusqlite/functions"]

# Activate the rusqlite "time" feature
time = ["rusqlite/time"]

# Activate the rusqlite "trace" feature
trace = ["rusqlite/trace"]

# Activate the rusqlite "url" feature
url = ["rusqlite/url"]

wal-pool = ["crossbeam-channel"]

[workspace]
resolver = "3"
members = [
    "benchmark",
]
