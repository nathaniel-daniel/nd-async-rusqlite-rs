[package]
name = "benchmark"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
csv = "1.4.0"
nd-async-rusqlite = { version = "0.0.0", path = "..", features = [ "wal-pool" ] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = { version = "0.10.3", features = [ "std_rng" ], default-features = false }
tokio = { version = "1.54.1", features = [ "rt-multi-thread" ] }
tokio-rusqlite = "0.8.0"
